<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Number Generator Pro</title>
</head>
<body>
  <div class="bg-animation"></div>

  <div class="card">
    <h1>🎲 Number Generator</h1>
    <p class="subtitle">Gere números aleatórios com estilo</p>

    <div class="inputs">
      <div class="input-box">
        <label>Mínimo</label>
        <input type="number" id="min" placeholder="Ex: 1">
      </div>
      <div class="input-box">
        <label>Máximo</label>
        <input type="number" id="max" placeholder="Ex: 100">
      </div>
    </div>

    <button id="generate">Gerar Número</button>

    <div id="result">
      <span>0</span>
    </div>
  </div>

  <script src="assets/js/script.js"></script>
</body>
</html>
